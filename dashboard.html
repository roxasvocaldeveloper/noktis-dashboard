<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Soundvertise — Artist Analytics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter','sans-serif'] },
      colors: {
        // Soundvertise palette: viola + neutri. Niente rosso/verde.
        bg:        '#0A0716',
        surface:   '#15102A',
        elevated:  '#1E1740',
        border:    '#2A2150',
        muted:     '#9690B8',
        text:      '#ECE9F7',
        accent:    '#9D7BFF',
        'accent-2':'#C8B5FF',
        'accent-soft':'#5B3FBF',
      },
    },
  },
};
</script>
<style type="text/tailwindcss">
  @layer base {
    html, body { @apply text-text font-sans antialiased; }
    body {
      background: linear-gradient(180deg, rgba(10,7,22,0.85) 0%, rgba(10,7,22,0.95) 100%), url('sfondo.webp') center/cover fixed no-repeat;
      min-height: 100vh;
    }
    .material-symbols-outlined { font-variation-settings: 'opsz' 20; vertical-align: middle; }
  }
  @layer components {
    .glass    { @apply bg-surface/40 backdrop-blur-xl border border-white/10; }
    .card     { @apply glass rounded-2xl p-5 shadow-xl shadow-black/30; }
    .row      { @apply flex items-center gap-3 py-2.5 px-2 rounded-lg; }
    .row-btn  { @apply cursor-pointer hover:bg-white/5 transition-colors; }
    .pill     { @apply inline-flex items-center gap-1 text-xs font-semibold text-muted bg-white/5 border border-white/10 rounded-full px-2.5 py-1; }
    .tab      { @apply px-4 py-2 text-sm font-semibold text-muted border-b-2 border-transparent cursor-pointer; }
    .tab-on   { @apply text-text border-accent; }
    .metric   { @apply text-left glass rounded-xl p-4 w-full; }
    .metric-clickable { @apply hover:border-accent/60 cursor-pointer; }
    .modal    { @apply fixed inset-0 z-50 flex items-center justify-center p-4; }
    .modal[hidden] { display: none; }
    .modal-bg { @apply absolute inset-0 bg-black/70 backdrop-blur-sm; }
    .modal-box{ @apply relative w-full max-w-xl bg-surface/90 backdrop-blur-xl border border-white/10 rounded-2xl flex flex-col overflow-hidden max-h-[85vh] shadow-2xl; }
    .input    { @apply bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm text-text placeholder-muted focus:outline-none focus:border-accent w-full; }
    .btn      { @apply bg-accent text-bg font-semibold rounded-lg px-4 py-2 text-sm hover:opacity-90; }
    .btn-ghost{ @apply bg-white/5 border border-white/10 text-text font-medium rounded-lg px-3 py-2 text-sm hover:border-accent/60; }
    .section-title { @apply text-sm font-bold uppercase tracking-wider text-muted mb-3; }
    .stat-label  { @apply text-xs text-muted font-medium; }
    .stat-value  { @apply text-2xl font-bold text-text mt-1 tabular-nums; }
    .delta-up    { @apply text-accent-2 text-xs font-semibold; }
    .delta-down  { @apply text-muted text-xs font-semibold; }
  }
</style>
</head>
<body class="min-h-screen">

<!-- ──────────────── HEADER ──────────────── -->
<header class="border-b border-white/10 bg-surface/50 backdrop-blur-xl sticky top-0 z-30">
  <div class="max-w-5xl mx-auto px-5 py-4 flex items-center gap-4 flex-wrap">
    <div class="flex items-center gap-2 mr-auto">
      <span class="material-symbols-outlined text-accent">graphic_eq</span>
      <span class="font-extrabold text-base">Soundvertise</span>
    </div>
    <form id="artist-form" class="flex items-center gap-2 w-full sm:w-auto">
      <input id="artist-input" class="input sm:w-72" placeholder="Spotify Artist ID o URL" autocomplete="off"/>
      <button class="btn" type="submit">Carica</button>
    </form>
  </div>

  <!-- Artist banner -->
  <div id="artist-banner" hidden class="max-w-5xl mx-auto px-5 pb-4 flex items-center gap-4">
    <img id="artist-avatar" class="w-14 h-14 rounded-full border border-white/10" alt=""/>
    <div class="min-w-0">
      <h1 id="artist-name" class="text-xl font-extrabold truncate">—</h1>
      <p id="artist-meta" class="text-xs text-muted truncate">—</p>
    </div>
  </div>
</header>

<!-- ──────────────── MAIN ──────────────── -->
<main class="max-w-5xl mx-auto px-5 py-6">

  <!-- Empty state -->
  <section id="empty-state" class="card text-center py-16">
    <span class="material-symbols-outlined text-5xl text-muted mb-3 block">search</span>
    <h2 class="text-lg font-bold mb-2">Inserisci uno Spotify Artist ID</h2>
    <p class="text-sm text-muted max-w-md mx-auto">
      Incolla un ID artista Spotify (es. <code class="text-accent">0brsGLNpCQEHXNblDDKWK0</code>)
      o un URL di profilo Spotify. I dati di tutte le piattaforme verranno caricati automaticamente.
    </p>
  </section>

  <!-- Error state -->
  <section id="error-state" hidden class="card text-center py-10 border-accent/40">
    <span class="material-symbols-outlined text-3xl text-accent mb-2 block">error</span>
    <p id="error-msg" class="text-sm text-muted">—</p>
  </section>

  <!-- Dashboard -->
  <section id="dashboard" hidden>

    <!-- Tabs -->
    <nav class="flex items-center gap-1 border-b border-white/10 mb-6 overflow-x-auto">
      <button data-tab="spotify"   class="tab tab-on">Spotify</button>
      <button data-tab="tiktok"    class="tab">TikTok</button>
      <button data-tab="instagram" class="tab">Instagram</button>
    </nav>

    <!-- Each tab is rendered with the same template (see #tab-template) -->
    <div id="tab-spotify"   data-platform="spotify"></div>
    <div id="tab-tiktok"    data-platform="tiktok"    hidden></div>
    <div id="tab-instagram" data-platform="instagram" hidden></div>

  </section>
</main>

<!-- ──────────────── LIST MODAL ──────────────── -->
<div id="list-modal" class="modal" hidden>
  <div class="modal-bg" data-close></div>
  <div class="modal-box">
    <div class="flex items-center gap-3 p-4 border-b border-white/10">
      <h3 id="list-title" class="font-bold text-base flex-1 truncate">—</h3>
      <span id="list-count" class="pill">0</span>
      <button class="btn-ghost !p-2" data-close aria-label="Chiudi">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <ul id="list-body" class="overflow-y-auto p-2"></ul>
  </div>
</div>

<!-- ──────────────── CHART MODAL ──────────────── -->
<div id="chart-modal" class="modal" hidden>
  <div class="modal-bg" data-close></div>
  <div class="modal-box max-w-2xl">
    <div class="flex items-center gap-3 p-4 border-b border-white/10">
      <h3 id="chart-title" class="font-bold text-base flex-1 truncate">—</h3>
      <button class="btn-ghost !p-2" data-close aria-label="Chiudi">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="p-5">
      <div id="chart-wrap" class="relative">
        <svg id="chart-svg" viewBox="0 0 600 200" preserveAspectRatio="none" class="w-full h-48 block">
          <defs>
            <linearGradient id="chart-grad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%"  stop-color="#9D7BFF" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#9D7BFF" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path id="chart-area" fill="url(#chart-grad)"/>
          <path id="chart-line" fill="none" stroke="#9D7BFF" stroke-width="2"/>
          <line id="chart-cursor" stroke="#C8B5FF" stroke-width="1" stroke-dasharray="3 3" y1="0" y2="200" x1="-10" x2="-10"/>
          <circle id="chart-dot" r="4" fill="#C8B5FF" cx="-10" cy="-10"/>
        </svg>
        <div id="chart-tip" hidden class="pointer-events-none absolute -translate-x-1/2 -translate-y-full bg-elevated border border-white/10 rounded-lg px-2.5 py-1.5 text-xs shadow-lg whitespace-nowrap">
          <span id="chart-tip-date" class="text-muted block"></span>
          <span id="chart-tip-val"  class="text-text font-bold tabular-nums"></span>
        </div>
      </div>
      <div id="chart-stats" class="grid grid-cols-3 gap-3 mt-4"></div>
    </div>
  </div>
</div>

<!-- ──────────────── TAB TEMPLATE ──────────────── -->
<template id="tab-template">
  <div class="space-y-6">

    <!-- Hero metrics (3 cards) — uniform across platforms -->
    <div class="grid grid-cols-3 gap-3" data-slot="metrics"></div>

    <!-- Latest release (Spotify only): track-specific stats -->
    <div class="card" data-slot="release" hidden>
      <p class="section-title">Last Release</p>
      <div class="flex items-center gap-4 mb-4">
        <img data-slot="release-art" class="w-20 h-20 rounded-xl border border-white/10 shadow-lg" alt=""/>
        <div class="min-w-0 flex-1">
          <p data-slot="release-title" class="text-lg font-extrabold truncate">—</p>
          <p data-slot="release-date"  class="text-xs text-muted mt-1">—</p>
          <span data-slot="release-pill" class="pill mt-2"><span class="material-symbols-outlined text-accent !text-sm">radio_button_checked</span>in rotazione</span>
        </div>
      </div>
      <div data-slot="release-metrics" class="grid grid-cols-3 gap-3"></div>
    </div>

    <!-- Recent activity — opens list modal -->
    <div class="card">
      <div class="flex items-center justify-between mb-3">
        <p class="section-title !mb-0">Recent Milestones</p>
        <button class="text-xs text-accent font-semibold hover:text-accent-2" data-slot="activity-more">Vedi tutto</button>
      </div>
      <ul data-slot="activity-list" class="divide-y divide-white/5"></ul>
    </div>

    <!-- Audience (compact) -->
    <div class="card">
      <p class="section-title">Audience</p>
      <ul data-slot="audience-list" class="grid grid-cols-1 sm:grid-cols-2 gap-x-6"></ul>
    </div>

  </div>
</template>

<!-- ──────────────── COMPONENTS (small templates) ──────────────── -->
<template id="metric-template">
  <button class="metric">
    <p class="stat-label" data-slot="label">—</p>
    <p class="stat-value" data-slot="value">—</p>
    <p class="text-xs mt-1" data-slot="delta"></p>
  </button>
</template>

<template id="row-template">
  <li class="row">
    <img data-slot="img" class="w-9 h-9 rounded-lg border border-white/10 flex-shrink-0 object-cover" alt=""/>
    <div class="min-w-0 flex-1">
      <p data-slot="label" class="text-sm font-semibold truncate">—</p>
      <p data-slot="sub"   class="text-xs text-muted truncate">—</p>
    </div>
    <p data-slot="value" class="text-sm font-bold tabular-nums flex-shrink-0">—</p>
  </li>
</template>

<!-- ──────────────── APP SCRIPT ──────────────── -->
<script type="module">

// ───────── utils ─────────
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const fmt = n => {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return Math.round(n).toLocaleString('it-IT');
};
const fmtDelta = (cur, prev) => {
  if (cur == null || prev == null || !isFinite(prev) || prev === 0) return '';
  const d = ((cur - prev) / prev) * 100;
  return (d >= 0 ? '+' : '') + d.toFixed(1) + '%';
};
const fmtDate = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' });
};
const flag = cc => cc
  ? `<img src="https://flagcdn.com/w20/${cc.toLowerCase()}.png" class="w-5 h-3.5 rounded-sm object-cover border border-border" alt="${cc}"/>`
  : '';

const parseSpotifyId = s => {
  s = (s || '').trim();
  const m = s.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?artist\/([A-Za-z0-9]+)/);
  if (m) return m[1];
  if (/^[A-Za-z0-9]{18,30}$/.test(s)) return s;
  return null;
};

// ───────── API wrapper ─────────
const api = async (route, params = {}) => {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(`/api/${route}${qs ? '?' + qs : ''}`);
  if (!r.ok) throw new Error(`${route}: HTTP ${r.status}`);
  return r.json();
};

// ───────── render: metric card ─────────
function renderMetric(slot, { label, value, delta, onClick, tooltip }) {
  const node = $('#metric-template').content.firstElementChild.cloneNode(true);
  node.querySelector('[data-slot=label]').textContent = label;
  node.querySelector('[data-slot=value]').textContent = value;
  const deltaEl = node.querySelector('[data-slot=delta]');
  if (delta) {
    deltaEl.textContent = delta;
    deltaEl.className = 'text-xs mt-1 font-semibold ' + (delta.startsWith('-') ? 'text-muted' : 'text-accent-2');
  }
  if (tooltip) node.title = tooltip;
  if (onClick) {
    node.classList.add('metric-clickable');
    node.addEventListener('click', onClick);
  } else {
    node.disabled = true;
    node.classList.add('cursor-default');
  }
  slot.appendChild(node);
}

// ───────── render: row (image + label + value) ─────────
function renderRow(slot, { img, label, sub, value, onClick, href }) {
  const tpl = $('#row-template').content.firstElementChild.cloneNode(true);
  const imgEl = tpl.querySelector('[data-slot=img]');
  if (img) imgEl.src = img;
  else imgEl.remove();
  tpl.querySelector('[data-slot=label]').textContent = label || '—';
  tpl.querySelector('[data-slot=sub]').innerHTML  = sub  || '';
  tpl.querySelector('[data-slot=value]').textContent = value || '';
  if (onClick || href) {
    tpl.classList.add('row-btn');
    if (href) tpl.addEventListener('click', () => window.open(href, '_blank', 'noopener'));
    if (onClick) tpl.addEventListener('click', onClick);
  }
  slot.appendChild(tpl);
}

// ───────── modal: list ─────────
function openList(title, items) {
  $('#list-title').textContent = title;
  $('#list-count').textContent = items.length;
  const body = $('#list-body');
  body.innerHTML = '';
  if (!items.length) {
    body.innerHTML = '<li class="text-center text-muted text-sm py-8">Nessun risultato.</li>';
  } else {
    items.slice(0, 200).forEach(it => renderRow(body, it));
  }
  $('#list-modal').hidden = false;
}

// ───────── modal: chart (interactive) ─────────
let chartState = null;
function openChart(title, points, stats) {
  $('#chart-title').textContent = title;
  const W = 600, H = 200, pad = 10;
  const vals = points.map(p => p.value);
  const min = Math.min(...vals), max = Math.max(...vals), range = (max - min) || 1;
  const xStep = (W - pad * 2) / Math.max(points.length - 1, 1);
  const coords = points.map((p, i) => [pad + i * xStep, H - pad - ((p.value - min) / range) * (H - pad * 2)]);
  const line = coords.map((c, i) => (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const area = line + ` L${coords[coords.length-1][0].toFixed(1)},${H-pad} L${coords[0][0].toFixed(1)},${H-pad} Z`;
  $('#chart-line').setAttribute('d', line);
  $('#chart-area').setAttribute('d', area);
  chartState = { points, coords, W, H };
  $('#chart-stats').innerHTML = stats.map(s => `
    <div class="glass rounded-xl p-3">
      <p class="stat-label">${s.label}</p>
      <p class="stat-value !text-lg">${s.value}</p>
    </div>`).join('');
  $('#chart-modal').hidden = false;
}

// Chart hover interaction (set up once)
(() => {
  const svg = $('#chart-svg'), tip = $('#chart-tip'), wrap = $('#chart-wrap');
  const cursor = $('#chart-cursor'), dot = $('#chart-dot');
  const hide = () => { tip.hidden = true; cursor.setAttribute('x1', -10); cursor.setAttribute('x2', -10); dot.setAttribute('cx', -10); };
  svg.addEventListener('mouseleave', hide);
  svg.addEventListener('mousemove', e => {
    if (!chartState) return;
    const { points, coords, W, H } = chartState;
    const rect = svg.getBoundingClientRect();
    const xRatio = (e.clientX - rect.left) / rect.width;
    const svgX = xRatio * W;
    let nearest = 0, best = Infinity;
    coords.forEach(([cx], i) => { const d = Math.abs(cx - svgX); if (d < best) { best = d; nearest = i; } });
    const [cx, cy] = coords[nearest];
    cursor.setAttribute('x1', cx); cursor.setAttribute('x2', cx);
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy);
    tip.hidden = false;
    const px = (cx / W) * rect.width;
    const py = (cy / H) * rect.height;
    tip.style.left = px + 'px';
    tip.style.top  = (py - 8) + 'px';
    $('#chart-tip-date').textContent = fmtDate(points[nearest].date);
    $('#chart-tip-val').textContent  = fmt(points[nearest].value);
  });
})();

// close handlers (delegation, once)
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) {
    e.target.closest('.modal').hidden = true;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.modal').forEach(m => m.hidden = true);
});

// ───────── tab switching ─────────
$$('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    const id = btn.dataset.tab;
    $$('[data-tab]').forEach(b => b.classList.toggle('tab-on', b === btn));
    $$('#tab-spotify, #tab-tiktok, #tab-instagram').forEach(p => p.hidden = (p.id !== 'tab-' + id));
  });
});

// ───────── platform config (uniform schema) ─────────
const PLATFORMS = {
  spotify: {
    label: 'Spotify',
    metrics: [
      { key: 'followers_total',      label: 'Followers',         historic: 'followers_total'      },
      { key: 'monthly_listeners_current', label: 'Monthly listeners', historic: 'monthly_listeners_current', tooltip: 'Ascoltatori mensili (ultimi 28gg)' },
      { key: 'streams_total',        label: 'Streams totali',    historic: 'streams_total'        },
    ],
    showRelease: true,
  },
  tiktok: {
    label: 'TikTok',
    metrics: [
      { key: 'followers_total', label: 'Followers',     historic: 'followers_total' },
      { key: 'likes_total',     label: 'Likes totali',  historic: 'likes_total'     },
      { key: 'videos_total',    label: 'Video con audio', historic: 'videos_total'  },
    ],
    showRelease: false,
  },
  instagram: {
    label: 'Instagram',
    metrics: [
      { key: 'followers_total', label: 'Followers', historic: 'followers_total' },
      { key: 'following_total', label: 'Following', historic: 'following_total' },
      { key: 'posts_total',     label: 'Post',      historic: 'posts_total'     },
    ],
    showRelease: false,
  },
};

// ───────── state ─────────
const state = {
  spotifyId: null,
  artistInfo: null,
  stats: {},       // { spotify: {...}, tiktok: {...}, instagram: {...} }
  historic: {},    // historic_stats payload, indexed by source
  activities: [],  // raw activities
  audience: {},    // audience payload by source
  topTrack: null,
};

// ───────── main loader ─────────
async function loadArtist(spotifyId) {
  state.spotifyId = spotifyId;
  localStorage.setItem('spotifyId', spotifyId);

  $('#empty-state').hidden = true;
  $('#error-state').hidden = true;
  $('#dashboard').hidden   = false;
  // Reset UI to skeletons
  Object.keys(PLATFORMS).forEach(p => mountTab(p, true));

  const params = { spotify_artist_id: spotifyId };

  try {
    // 1. Artist info (header) ─ blocking
    const info = (await api('artist_info', params)).artist_info || {};
    state.artistInfo = info;
    renderArtistBanner(info);

    // 2. Parallel fetches
    const [stats, historic, activities, audience, catalog] = await Promise.all([
      api('songstats',      params).catch(() => ({ stats: [] })),
      api('historic_stats', params).catch(() => ({ stats: [] })),
      api('activities',     { ...params, limit: 100 }).catch(() => ({ activities: [] })),
      api('audience',       params).catch(() => ({ audience: [] })),
      api('catalog',        params).catch(() => ({ tracks: [] })),
    ]);

    state.stats      = indexBy(stats.stats || [], 'source');
    state.historic   = indexBy(historic.stats || [], 'source');
    state.activities = activities.activities || activities.data || [];
    state.audience   = indexBy(audience.audience || [], 'source');

    // Pick most recent track from catalog and fetch its stats
    const tracks = (catalog.tracks || catalog.data || []).slice();
    tracks.sort((a, b) => new Date(b.released || b.release_date || 0) - new Date(a.released || a.release_date || 0));
    const latest = tracks[0];
    if (latest && latest.isrc) {
      try {
        const ts = await api('track_stats', { isrc: latest.isrc, songstats_artist_id: state.artistInfo.songstats_artist_id, with_playlists: 'true' });
        const bySource = indexBy(ts.stats || [], 'source');
        state.topTrack = { ...latest, stats: bySource };
      } catch { state.topTrack = latest; }
    } else { state.topTrack = null; }

    Object.keys(PLATFORMS).forEach(p => mountTab(p, false));
  } catch (e) {
    showError(e.message || 'Errore caricamento dati.');
  }
}

const indexBy = (arr, key) => Object.fromEntries(arr.map(x => [x[key], x.data || x]));

function showError(msg) {
  $('#dashboard').hidden    = true;
  $('#error-state').hidden  = false;
  $('#error-msg').textContent = msg;
}

function renderArtistBanner(info) {
  $('#artist-banner').hidden = false;
  $('#artist-avatar').src = info.avatar || '';
  $('#artist-name').textContent = info.name || '—';
  const genres = (info.genres || []).slice(0, 3).join(' · ');
  $('#artist-meta').textContent = [info.country, genres].filter(Boolean).join(' · ');
}

// ───────── mount one tab (reuses template) ─────────
function mountTab(platform, loading) {
  const cfg = PLATFORMS[platform];
  const root = document.getElementById('tab-' + platform);
  root.innerHTML = '';
  const tpl = $('#tab-template').content.firstElementChild.cloneNode(true);
  root.appendChild(tpl);

  const slot = name => tpl.querySelector(`[data-slot=${name}]`);

  // --- 1. Metrics
  const stats = state.stats[platform] || {};
  const hist  = (state.historic[platform] || {}).history || [];
  cfg.metrics.forEach(m => {
    const cur = stats[m.key];
    const series = hist.map(h => ({ date: h.date, value: h[m.historic] })).filter(p => p.value != null);
    const prev = series.length > 7 ? series[series.length - 8].value : null;
    renderMetric(slot('metrics'), {
      label: m.label,
      value: loading ? '…' : fmt(cur),
      delta: !loading ? fmtDelta(cur, prev) : '',
      tooltip: m.tooltip,
      onClick: series.length > 1 ? () => openChart(`${cfg.label} · ${m.label}`,
        series,
        [
          { label: 'Attuale',  value: fmt(cur) },
          { label: '7gg fa',   value: fmt(prev) },
          { label: 'Δ 7gg',    value: fmtDelta(cur, prev) || '—' },
        ]) : null,
    });
  });

  // --- 2. Latest release (Spotify only) — track-specific stats
  if (cfg.showRelease) {
    const t = state.topTrack;
    if (t) {
      slot('release').hidden = false;
      slot('release-art').src   = t.avatar || t.image || '';
      slot('release-title').textContent = t.title || t.name || '—';
      slot('release-date').textContent  = [t.artist_name || state.artistInfo?.name, fmtDate(t.released || t.release_date)].filter(Boolean).join(' · ');
      const sp = (t.stats?.spotify) || {};
      const tk = (t.stats?.tiktok)  || {};
      const sh = (t.stats?.shazam)  || {};
      const metricsSlot = slot('release-metrics');
      metricsSlot.innerHTML = '';
      const trackMetrics = [
        { label: 'Popularity',   value: sp.popularity_current != null ? sp.popularity_current + '/100' : '—' },
        { label: 'Streams',      value: fmt(sp.streams_total) },
        { label: 'Playlist Att.',value: fmt(sp.playlists_current), onClick: t.isrc ? () => openTrackPlaylists(t) : null },
        { label: 'Playlist Reach', value: fmt(sp.playlist_reach_current) },
        { label: 'TikTok Video', value: fmt(tk.videos_total) },
        { label: 'Shazams',      value: fmt(sh.shazams_total) },
      ];
      trackMetrics.forEach(m => renderMetric(metricsSlot, m));
    }
  }

  // --- 3. Recent activity (filter by source if available)
  const acts = (state.activities || []).filter(a =>
    !a.source || a.source === platform || (platform === 'instagram' && a.source === 'instagram')
  );
  const top5 = acts.slice(0, 5);
  if (loading || !top5.length) {
    slot('activity-list').innerHTML = `<li class="text-sm text-muted py-3">${loading ? 'Caricamento…' : 'Nessuna attività recente.'}</li>`;
  } else {
    top5.forEach(a => renderRow(slot('activity-list'), activityRow(a)));
  }
  slot('activity-more').addEventListener('click', () => openList(
    `${cfg.label} · Attività recenti`,
    acts.slice(0, 100).map(activityRow),
  ));

  // --- 4. Audience (compact, top 6)
  const aud = state.audience[platform] || {};
  const top = audienceItems(aud).slice(0, 6);
  if (!top.length) {
    slot('audience-list').innerHTML = `<li class="text-sm text-muted py-3">Dati audience non disponibili.</li>`;
  } else {
    top.forEach(({ label, sub, value, cc }) => renderRow(slot('audience-list'), {
      img: null, label: (cc ? `${flag(cc)} ` : '') + label, sub, value,
    }));
  }
}

// activity → row props
function activityRow(a) {
  return {
    img:   a.activity_avatar || a.avatar || null,
    label: a.activity_text || a.text || a.title || 'Attività',
    sub:   fmtDate(a.activity_date || a.date),
    value: a.followers ? fmt(a.followers) : '',
    href:  a.activity_url || a.url || null,
  };
}

// audience payload → uniform items
function audienceItems(aud) {
  if (!aud) return [];
  // Spotify: top_cities; TikTok/Instagram: top_countries
  if (aud.top_cities) {
    return aud.top_cities.map(c => ({
      label: c.city, cc: c.country_code,
      sub: c.country_name || c.country_code,
      value: fmt(c.listeners || c.followers || c.value),
    }));
  }
  if (aud.top_countries) {
    return aud.top_countries.map(c => ({
      label: c.country_name || c.country, cc: c.country_code || c.country,
      sub: '',
      value: fmt(c.listeners || c.followers || c.value),
    }));
  }
  return [];
}

// ───────── track playlists (reuses list modal) ─────────
async function openTrackPlaylists(track) {
  openList(`Playlist · ${track.title || track.name}`, [{ label: 'Caricamento…', sub: '', value: '' }]);
  try {
    const d = await api('track_stats', {
      isrc: track.isrc,
      songstats_artist_id: state.artistInfo.songstats_artist_id,
      source: 'spotify', with_playlists: 'true', limit: 100,
    });
    const sp = (d.stats || []).find(s => s.source === 'spotify') || {};
    const playlists = ((sp.data || {}).playlists || [])
      .filter(p => p.removed_at == null)
      .sort((a, b) => (b.followers_count || 0) - (a.followers_count || 0))
      .map(p => ({
        img: p.artwork, label: p.name, sub: fmtDate(p.added_at),
        value: fmt(p.followers_count), href: p.external_url,
      }));
    openList(`Playlist · ${track.title || track.name}`, playlists);
  } catch (e) {
    openList('Errore', [{ label: e.message, sub: '', value: '' }]);
  }
}

// ───────── boot ─────────
$('#artist-form').addEventListener('submit', e => {
  e.preventDefault();
  const id = parseSpotifyId($('#artist-input').value);
  if (!id) { alert('ID artista Spotify non valido.'); return; }
  loadArtist(id);
});

const saved = localStorage.getItem('spotifyId');
if (saved) {
  $('#artist-input').value = saved;
  loadArtist(saved);
}

</script>
