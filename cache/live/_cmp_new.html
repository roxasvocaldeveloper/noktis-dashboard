<script>
(function() {
  const CMP = {"dates":["2026-05-02","2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-05-07","2026-05-08","2026-05-09","2026-05-10","2026-05-11","2026-05-12","2026-05-13","2026-05-14","2026-05-15","2026-05-16","2026-05-17","2026-05-18","2026-05-19","2026-05-20","2026-05-21","2026-05-22","2026-05-23","2026-05-24","2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29","2026-05-30","2026-05-31"],"series":[{"label":"goodbyes","color":"#5FE0B0","growth":[0,0,0,0,0,8593,8593,8593,8593,8593,8593,8593,8593,18431,18431,18431,18431,18431,18431,18431,26768,26768,26768,26768,26768,26768,26768,35137,35137,35137],"gain":35137,"art":"https://i.scdn.co/image/ab67616d00001e028cfe25ed0d181a59b2adec47"},{"label":"why did i fail","color":"#7C9CFF","growth":[0,837,837,2477,2477,4122,4122,4122,4122,4122,4122,8661,8661,8661,8661,8661,12524,12524,12524,12524,15588,15588,15588,17679,17679,19120,19120,20611,20611,20611],"gain":20611,"art":"https://i.scdn.co/image/ab67616d00001e02886b188290fbcff15d6fe521"},{"label":"Unforgettable","color":"#FFA94D","growth":[0,0,0,0,0,2327,2327,2327,2327,2327,2327,2327,2327,4866,4866,4866,4866,4866,4866,4866,7136,7136,7136,7136,7136,7136,7136,9456,9456,9456],"gain":9456,"art":"https://i.scdn.co/image/ab67616d00001e024b50da3a7d3845656a45279a"},{"label":"Not Enough","color":"#FF6B9D","growth":[0,0,0,0,0,2206,2206,2206,2206,2206,2206,2206,2206,4893,4893,4893,4893,4893,4893,4893,7261,7261,7261,7261,7261,7261,7261,9377,9377,9377],"gain":9377,"art":"https://i.scdn.co/image/ab67616d00001e0287897e1ac2ef436678cd33aa"},{"label":"Berlin","color":"#9747FF","growth":[0,0,0,0,0,302,302,302,302,302,302,302,302,616,616,616,616,616,616,616,971,971,971,971,971,971,971,1220,1220,1220],"gain":1220,"art":"https://i.scdn.co/image/ab67616d00001e029494eeac6a088d0460830996"}]};
  const svg = document.getElementById('cmp-chart');
  if (!svg) return;
  const W=760, H=280, padL=8, padR=8, padT=12, padB=12;
  const cw=W-padL-padR, ch=H-padT-padB;
  const n = CMP.dates.length;
  const allVals = CMP.series.flatMap(s => s.growth);
  const maxV = Math.max(...allVals, 1);
  const xStep = cw/(n-1);
  const X = i => padL + i*xStep;
  const Y = v => padT + ch - (v/maxV)*ch;
  const fmtK = v => v>=1000 ? (v/1000).toFixed(1)+'K' : Math.round(v);

  // Gridlines
  let grid='';
  for(let t=0;t<=4;t++){
    const gv = maxV*t/4, gy = Y(gv);
    grid += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+cw)+'" y2="'+gy+'" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
    grid += '<text x="'+(padL+2)+'" y="'+(gy-3)+'" font-size="9" fill="rgba(255,255,255,0.35)" font-family="Montserrat,sans-serif">+'+fmtK(gv)+'</text>';
  }
  // Linee
  let paths='';
  CMP.series.forEach(s=>{
    const pts = s.growth.map((v,i)=>X(i)+','+Y(v)).join(' ');
    paths += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  svg.innerHTML = grid + paths +
    '<line id="cmp-xh" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+ch)+'" stroke="rgba(255,255,255,0.4)" stroke-dasharray="3,3" opacity="0"/>' +
    CMP.series.map(s=>'<circle class="cmp-dot" r="4" fill="'+s.color+'" stroke="#0a0a0a" stroke-width="1.5" opacity="0"/>').join('') +
    '<rect x="'+padL+'" y="0" width="'+cw+'" height="'+H+'" fill="transparent" style="cursor:crosshair"/>';

  // Legenda con artwork + titolo + gain (ordinata per gain desc)
  const legend = document.getElementById('cmp-legend');
  legend.innerHTML = CMP.series.map(s=>
    '<span class="inline-flex items-center gap-2 rounded-lg border border-secondary-500/20 bg-black/20 px-2 py-1">' +
      '<img src="'+s.art+'" class="h-6 w-6 rounded shrink-0">' +
      '<span style="width:8px;height:8px;border-radius:50%;background:'+s.color+';display:inline-block"></span>' +
      '<span class="text-xs text-white font-semibold">'+s.label+'</span>' +
      '<span class="text-xs text-green-400 font-bold">+'+fmtK(s.gain)+'</span>' +
    '</span>').join('');

  const xh = document.getElementById('cmp-xh');
  const dots = [...svg.querySelectorAll('.cmp-dot')];
  const tip = document.getElementById('cmp-tip');
  const hit = svg.querySelector('rect');

  function move(clientX, clientY){
    const r = svg.getBoundingClientRect();
    const scaleX = W/r.width;
    const px = (clientX - r.left) * scaleX - padL;
    const i = Math.max(0, Math.min(n-1, Math.round(px/xStep)));
    const cx = X(i);
    xh.setAttribute('x1',cx); xh.setAttribute('x2',cx); xh.setAttribute('opacity','0.6');
    CMP.series.forEach((s,k)=>{ dots[k].setAttribute('cx',cx); dots[k].setAttribute('cy',Y(s.growth[i])); dots[k].setAttribute('opacity','1'); });
    const d = new Date(CMP.dates[i]);
    const ds = d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
    // Ordina le serie per valore al giorno i (desc) nel tooltip
    const rows = CMP.series.map(s=>({l:s.label,c:s.color,v:s.growth[i]})).sort((a,b)=>b.v-a.v);
    tip.innerHTML = '<p class="text-xs font-bold text-white mb-1">'+ds+'</p>' +
      rows.map(rw=>'<p class="flex items-center justify-between gap-3 text-xs"><span class="flex items-center gap-1.5"><span style="width:7px;height:7px;border-radius:50%;background:'+rw.c+';display:inline-block"></span><span class="text-gray-400">'+rw.l+'</span></span><span class="text-white font-semibold">+'+fmtK(rw.v)+'</span></p>').join('');
    // Posiziona il tooltip vicino al cursore (dentro il contenitore relative)
    tip.classList.remove('hidden');
    const cxPx = (cx/W)*r.width;
    const tipW = tip.offsetWidth;
    let left = cxPx + 14;
    if (left + tipW > r.width) left = cxPx - tipW - 14;
    tip.style.left = Math.max(0,left) + 'px';
    tip.style.top = '8px';
  }
  hit.addEventListener('mousemove', e=>move(e.clientX, e.clientY));
  hit.addEventListener('touchstart', e=>{e.preventDefault();move(e.touches[0].clientX);},{passive:false});
  hit.addEventListener('touchmove', e=>{e.preventDefault();move(e.touches[0].clientX);},{passive:false});
  hit.addEventListener('mouseleave', ()=>{ xh.setAttribute('opacity','0'); dots.forEach(d=>d.setAttribute('opacity','0')); tip.classList.add('hidden'); });
})();
</script>
